name: fcl
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0-323.1.beta

dependencies:
  flutter:
    sdk: flutter
  fluent_ui: ^4.9.1
  fluentui_system_icons: ^1.1.252
  system_theme: ^2.3.1
  flutter_acrylic: ^1.1.4
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.3
  url_launcher: ^6.3.0
  window_manager: ^0.4.0
  flutter_i18n: ^0.36.2
  file_selector: ^1.0.3
  path_provider: ^2.1.4
  webview_windows: ^0.4.0
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  device_info_plus: ^10.1.2
  dyn_mouse_scroll: ^1.0.7
  package_info_plus: ^8.0.2
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.5
  win32_registry: ^1.1.4
  flutter_widget_from_html_core: ^0.15.1
  win32: ^5.5.3
  convert: ^3.1.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  msix: ^3.16.7

flutter:
  uses-material-design: true

  fonts:
    - family: HarnonyOSSans
      fonts:
        - asset: assets/fonts/hmos/sc_medium.ttf
        - asset: assets/fonts/hmos/sc_bold.ttf
          weight: 700
    - family: RebyteSans
      fonts:
        - asset: assets/fonts/rebyte/pro_bold.otf
    - family: aNumber
      fonts:
        - asset: assets/fonts/anum/roundness_vf.otf

  assets:
    - assets/i18n/
    - assets/images/

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/images/launcher.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/launcher.png"
  liunx:
    generate: true
    image_path: "assets/images/launcher.png"